<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>tuxzilla.com</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                background-color: #000000;
                background-image: radial-gradient(
                    circle at 1px 1px,
                    rgba(0, 255, 0, 0.1) 1px,
                    transparent 0
                );
                background-size: 20px 20px;
                color: #00ff00;
                font-family: "Ubuntu Mono", monospace;
                text-align: center;
                padding: 0;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .nav {
                position: fixed;
                display: flex;
                top: 0;
                width: 100%;
                justify-content: space-between;
                padding: 16px;
                background-color: #000000;
            }

            .nav-page {
                color: #ffffff;
                font-size: 1.4rem;
                display: flex;
                margin-left: 15px
            }

            .nav-links {
                font-size: 1.4rem;
                display: flex;
                margin-right: 40px;
                gap: 24px;
                color: #ffffff;
            }

            .nav-links a {
                color: #ffffff;
                text-decoration: none;
            }

            .nav-links a:visited {
                color: #ffffff;
            }

            .hero {
                height: 600px;
                min-width: 100%;
                # background-color: #000000;
                border-bottom: 2px solid #00ff00;
                align-content: center;
                margin-bottom: 67px;
            }

            .container-right {
                margin-left: auto;
                max-width: 50%;
                border: 2px solid #00ff00;
                padding: 20px;
                align-self: left;
                align-items: center;
            }

            .container-left {
                margin-right: auto;
                max-width: 400px;
                border: 2px solid #00ff00;
                padding: 40px;
                align-self: right;
                align-items: center;
                margin-left: 67px;
            }

            h1 {
                font-size: 3.5rem;
                margin-bottom: 20px;
                text-align: center;
                text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            }

            p {
                font-size: 1.2rem;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="nav">
            <div class="nav-page">tuxzilla.com</div>
            <div class="nav-links">
                <a href="https://tuxzilla.com/">home</a>
                <a href="https://tuxzilla.com/about">about</a>
                <a href="https://hire.tuxzilla.com/">hire me</a>
            </div>
        </div>

        <div class="hero">
            <h1>Hi There!</h1>
            <p>Welcome to my Website!</p>
            <p></p>
        </div>

        <div class="container-left">this is some text in a container</div>
    </body>
</html>
